[build]
  # Migrations run against DATABASE_URL (direct host derived from the pooled one) before every build,
  # so the schema never lags behind the deployed code.
  command = "pnpm db:migrate && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # got-scraping/header-generator read JSON data files relative to their package dir, so they must be
  # copied as-is instead of being inlined into the bundle.
  external_node_modules = ["got-scraping"]

[functions."scrape-tick"]
  schedule = "*/30 * * * *"

# SPA fallback. Not forced, so function paths (/api/*) keep precedence.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
